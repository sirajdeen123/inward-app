<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-label="Every inward, checked together: five paint-dipped hands around a paint drop with a tick - gate-in, unloading, SED check, MRA mail, ERP and IRR">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82e0"/><stop offset="1" stop-color="#173d80"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1b2533" flood-opacity=".18"/></filter>
  </defs>

  <g transform="translate(270 238)">
    <!-- paint drops between the hands -->
    <g fill="#e2343d" opacity=".9">
      <g transform="rotate(36)"><ellipse cx="-7" cy="-188" rx="6" ry="8"/><ellipse cx="8" cy="-176" rx="4" ry="5.5"/></g>
      <g transform="rotate(108)" fill="#f5b51b"><ellipse cx="-7" cy="-188" rx="6" ry="8"/><ellipse cx="8" cy="-176" rx="4" ry="5.5"/></g>
      <g transform="rotate(180)" fill="#13a8b4"><ellipse cx="-7" cy="-188" rx="6" ry="8"/><ellipse cx="8" cy="-176" rx="4" ry="5.5"/></g>
      <g transform="rotate(252)" fill="#1f4fa3"><ellipse cx="-7" cy="-188" rx="6" ry="8"/><ellipse cx="8" cy="-176" rx="4" ry="5.5"/></g>
      <g transform="rotate(324)"><ellipse cx="-7" cy="-188" rx="6" ry="8"/><ellipse cx="8" cy="-176" rx="4" ry="5.5"/></g>
    </g>

    <!-- five hands, each dipped in paint, the paint running from the wrist towards the centre -->
    <g filter="url(#sh)">
      <g transform="rotate(0) translate(0 -66)">
        <path fill="#e2343d" d="M-28-8C-35-38-31-60-24-70H24C31-60 35-38 28-8 17 6-17 6-28-8Z"/>
        <g fill="none" stroke="#e2343d" stroke-linecap="round" stroke-width="17"><path d="M-17-62L-29-116"/><path d="M-3-68V-130"/><path d="M11-66L19-124"/><path d="M23-58L37-104"/><path d="M-25-30L-55-62"/></g>
        <path fill="#b8242c" d="M28-8C35-38 31-60 24-70H15C23-54 23-30 14-4 20-4 25-5 28-8Z"/>
        <path fill="#e2343d" d="M-27-8C-22 0-19 3-17 4-17 11-16 15-12 15-8 15-8 10-8 6-3 7 2 7 6 6 6 13 7 19 11 19 15 19 15 13 15 4 20 2 24-2 27-8Z"/>
      </g>
      <g transform="rotate(72) translate(0 -66)">
        <path fill="#1f4fa3" d="M-28-8C-35-38-31-60-24-70H24C31-60 35-38 28-8 17 6-17 6-28-8Z"/>
        <g fill="none" stroke="#1f4fa3" stroke-linecap="round" stroke-width="17"><path d="M-17-62L-29-116"/><path d="M-3-68V-130"/><path d="M11-66L19-124"/><path d="M23-58L37-104"/><path d="M-25-30L-55-62"/></g>
        <path fill="#173d80" d="M28-8C35-38 31-60 24-70H15C23-54 23-30 14-4 20-4 25-5 28-8Z"/>
        <path fill="#1f4fa3" d="M-27-8C-22 0-19 3-17 4-17 11-16 15-12 15-8 15-8 10-8 6-3 7 2 7 6 6 6 13 7 19 11 19 15 19 15 13 15 4 20 2 24-2 27-8Z"/>
      </g>
      <g transform="rotate(144) translate(0 -66)">
        <path fill="#f5b51b" d="M-28-8C-35-38-31-60-24-70H24C31-60 35-38 28-8 17 6-17 6-28-8Z"/>
        <g fill="none" stroke="#f5b51b" stroke-linecap="round" stroke-width="17"><path d="M-17-62L-29-116"/><path d="M-3-68V-130"/><path d="M11-66L19-124"/><path d="M23-58L37-104"/><path d="M-25-30L-55-62"/></g>
        <path fill="#d99a0c" d="M28-8C35-38 31-60 24-70H15C23-54 23-30 14-4 20-4 25-5 28-8Z"/>
        <path fill="#f5b51b" d="M-27-8C-22 0-19 3-17 4-17 11-16 15-12 15-8 15-8 10-8 6-3 7 2 7 6 6 6 13 7 19 11 19 15 19 15 13 15 4 20 2 24-2 27-8Z"/>
      </g>
      <g transform="rotate(216) translate(0 -66)">
        <path fill="#13a8b4" d="M-28-8C-35-38-31-60-24-70H24C31-60 35-38 28-8 17 6-17 6-28-8Z"/>
        <g fill="none" stroke="#13a8b4" stroke-linecap="round" stroke-width="17"><path d="M-17-62L-29-116"/><path d="M-3-68V-130"/><path d="M11-66L19-124"/><path d="M23-58L37-104"/><path d="M-25-30L-55-62"/></g>
        <path fill="#0e8590" d="M28-8C35-38 31-60 24-70H15C23-54 23-30 14-4 20-4 25-5 28-8Z"/>
        <path fill="#13a8b4" d="M-27-8C-22 0-19 3-17 4-17 11-16 15-12 15-8 15-8 10-8 6-3 7 2 7 6 6 6 13 7 19 11 19 15 19 15 13 15 4 20 2 24-2 27-8Z"/>
      </g>
      <g transform="rotate(288) translate(0 -66)">
        <path fill="#263b5e" d="M-28-8C-35-38-31-60-24-70H24C31-60 35-38 28-8 17 6-17 6-28-8Z"/>
        <g fill="none" stroke="#263b5e" stroke-linecap="round" stroke-width="17"><path d="M-17-62L-29-116"/><path d="M-3-68V-130"/><path d="M11-66L19-124"/><path d="M23-58L37-104"/><path d="M-25-30L-55-62"/></g>
        <path fill="#1a2a45" d="M28-8C35-38 31-60 24-70H15C23-54 23-30 14-4 20-4 25-5 28-8Z"/>
        <path fill="#263b5e" d="M-27-8C-22 0-19 3-17 4-17 11-16 15-12 15-8 15-8 10-8 6-3 7 2 7 6 6 6 13 7 19 11 19 15 19 15 13 15 4 20 2 24-2 27-8Z"/>
      </g>
    </g>

    <!-- centre: paint drop with a tick -->
    <circle r="40" fill="#fff" filter="url(#sh)"/>
    <path d="M0-30C10-17 20-7 20 6A20 20 0 0 1-20 6C-20-7-10-17 0-30Z" fill="url(#drop)"/>
    <path d="M-8 6l6 6 11-12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="-9" cy="-5" rx="3" ry="5" fill="#fff" opacity=".35" transform="rotate(25 -9 -5)"/>
  </g>

  <!-- tagline and the inward steps -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="270" y="460" font-size="22" font-weight="800" fill="#263b5e">Every inward, checked together</text>
    <path d="M150 474h240" stroke="#e2343d" stroke-width="3" stroke-linecap="round"/>
    <g font-size="12" font-weight="700" fill="#5b5e6b">
      <text x="62" y="512">Gate-in</text><text x="166" y="512">Unloading</text><text x="270" y="512">SED check</text><text x="374" y="512">MRA mail</text><text x="478" y="512">ERP &amp; IRR</text>
    </g>
    <path d="M62 494H478" stroke="#d6dce6" stroke-width="2"/>
    <g><circle cx="62" cy="494" r="6" fill="#e2343d"/><circle cx="166" cy="494" r="6" fill="#1f4fa3"/><circle cx="270" cy="494" r="6" fill="#f5b51b"/><circle cx="374" cy="494" r="6" fill="#13a8b4"/><circle cx="478" cy="494" r="6" fill="#263b5e"/></g>
  </g>
</svg>
