<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111;max-width:720px">
<table role="presentation" cellpadding="0" cellspacing="0" style="border-bottom:2px solid #2E2560;padding-bottom:6px;margin-bottom:12px;width:100%"><tr>
<td style="width:86px;vertical-align:top"><img src="cid:logo" alt="Berger" width="76" style="display:block"></td>
<td style="vertical-align:top"><div style="font-size:17px;font-weight:bold">{{ b.company }}</div>
<div style="font-weight:bold">Depot {{ b.depot_code }} · {{ b.depot_name }}</div>
<div style="font-size:12px">Operated by: {{ b.cfa }} (CFA)</div></td></tr></table>
{% block body %}{% endblock %}
<p style="margin-top:22px;font-size:13px"><b>{{ b.seal.for }}</b><br>{{ b.seal.operated }}</p>
<p style="font-size:11px;color:#666">Reference [{{ stamp }}] - generated by the Stock Inward application. Please keep the reference in the subject when replying.</p>
</div>
