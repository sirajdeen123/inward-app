# Inward application - separate Nginx site; the existing 'rainbow' site is not touched.
# Installed to /etc/nginx/sites-available/inward. HTTPS lines are added by certbot.

# Login rate limit per client IP (SoT 14.5): the app locks accounts, Nginx slows guessing.
limit_req_zone $binary_remote_addr zone=inward_login:10m rate=10r/m;

server {
    listen 80;
    server_name uat.inward.rainbowlogistics.co.in;

    client_max_body_size 50m;
    server_tokens off;

    location = /accounts/login/ {
        limit_req zone=inward_login burst=10 nodelay;
        include /etc/nginx/inward_proxy.conf;
        proxy_pass http://127.0.0.1:8100;
    }
    location / {
        include /etc/nginx/inward_proxy.conf;
        proxy_pass http://127.0.0.1:8100;
    }
}
